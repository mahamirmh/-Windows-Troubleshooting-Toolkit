name: Windows validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Static tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Parse PowerShell syntax
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './Toolkit.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){$errors | Format-List | Out-String | Write-Error; exit 1}
      - name: Verify entry points
        shell: pwsh
        run: |
          @('Start-Toolkit.cmd','Start-CLI.cmd','Toolkit.ps1','VERSION','CHANGELOG.md') | ForEach-Object { if(-not (Test-Path $_)){throw "Missing $_"} }
